name: Deploy Corsair Cat Web Remake

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate autonomous web build
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/styles.css
          test -s web/game.js
          test -s web/manifest.webmanifest
          test -s web/sw.js
          if find web -type f -iname 'CLAW.REZ' | grep -q .; then
            echo 'ERROR: proprietary game archive must not be deployed.' >&2
            exit 1
          fi
          if grep -RqiE 'openclaw\.(wasm|data)|arthurboss.github.io' web; then
            echo 'ERROR: remake must not depend on the old OpenClaw runtime.' >&2
            exit 1
          fi
          touch web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

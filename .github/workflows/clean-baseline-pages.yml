name: Clean baseline diagnostics preview

on:
  push:
    branches:
      - clean-baseline-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/arthurboss/claw-web.git
  UPSTREAM_PUBLISHED_COMMIT: ee5041244d7a6903f95523ddfc35eebeb0754f4f

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Fetch exact upstream published runtime
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-runtime
          git -C upstream-runtime remote add origin "$UPSTREAM_REPO"
          git -C upstream-runtime fetch --depth=1 origin "$UPSTREAM_PUBLISHED_COMMIT"
          git -C upstream-runtime checkout --detach FETCH_HEAD

          # Exact runtime hashes already used by the production baseline.
          test "$(git hash-object upstream-runtime/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object upstream-runtime/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object upstream-runtime/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'CLAW.REZ' upstream-runtime/asset-loader.js
          grep -q 'ASSETS.ZIP' upstream-runtime/config.xml

      - name: Assemble production root and clean baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site baseline-site
          mkdir -p _site baseline-site

          # Preserve the root exactly as the known upstream published runtime.
          git -C upstream-runtime archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          # Create an isolated preview from the same exact runtime.
          git -C upstream-runtime archive HEAD | tar -x -C baseline-site
          python3 scripts/inject_clean_diagnostics.py baseline-site

          # Give the WORKING baseline its own PWA identity so Android never
          # confuses it with the old root/recovery "Claw Web" installation.
          cat > baseline-site/site.webmanifest <<'EOF'
          {
            "id": "/Captain-Claw-Web/baseline/",
            "name": "Capitan Artiglio",
            "short_name": "Capitan Artiglio",
            "description": "Captain Claw (1997) browser port - working baseline",
            "start_url": "/Captain-Claw-Web/baseline/",
            "scope": "/Captain-Claw-Web/baseline/",
            "display": "fullscreen",
            "orientation": "landscape",
            "background_color": "#000000",
            "theme_color": "#000000",
            "launch_handler": {
              "client_mode": ["navigate-new", "auto"]
            },
            "icons": [
              {"src": "favicon-16x16.png", "sizes": "16x16", "type": "image/png"},
              {"src": "favicon-32x32.png", "sizes": "32x32", "type": "image/png"},
              {"src": "android-chrome-192x192.png", "sizes": "192x192", "type": "image/png"},
              {"src": "android-chrome-512x512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
              {"src": "android-chrome-512x512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"}
            ],
            "categories": ["games"],
            "lang": "it"
          }
          EOF

          # One-time baseline-only SW reset. The previous baseline cached the old
          # "Claw Web" manifest, so force that scope to unregister and clear its
          # own caches once. The runtime's sw-register.js fetches this file with
          # cache:'no-store', so even the old service worker cannot hide it.
          cat > baseline-site/sw-control.json <<'EOF'
          {
            "unregister": "baseline-pwa-identity-reset-20261024"
          }
          EOF

          # Also give future baseline SW caches a distinct version. This changes
          # only the PWA shell cache; the game binaries remain byte-identical.
          python3 - <<'PY'
          from pathlib import Path
          import re

          sw = Path('baseline-site/sw.js')
          text = sw.read_text(encoding='utf-8')
          text, n = re.subn(
              r'const CACHE_VERSION = "[^"]+";',
              'const CACHE_VERSION = "baseline-pwa-v1";',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not update baseline service-worker cache version')
          sw.write_text(text, encoding='utf-8')

          for name in ('index.html', 'claw-web.html'):
              p = Path('baseline-site') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('<title>Claw Web</title>', '<title>Capitan Artiglio</title>')
              s = s.replace('content="Claw Web"', 'content="Capitan Artiglio"')
              p.write_text(s, encoding='utf-8')
          PY

          mkdir -p _site/baseline
          rsync -a baseline-site/ _site/baseline/

          # No copyrighted game archive is ever published.
          rm -f _site/CLAW.REZ _site/baseline/CLAW.REZ

          # Root remains byte-identical for the three engine binaries.
          test "$(git hash-object _site/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object _site/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object _site/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"

          # Baseline engine binaries are also exactly upstream; only diagnostics/PWA metadata differ.
          test "$(git hash-object _site/baseline/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object _site/baseline/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object _site/baseline/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'clean-diagnostics.js' _site/baseline/index.html
          grep -q 'primary_archive=CLAW.REZ' _site/baseline/CLEAN_BASELINE.txt
          grep -q '"id": "/Captain-Claw-Web/baseline/"' _site/baseline/site.webmanifest
          grep -q '"start_url": "/Captain-Claw-Web/baseline/"' _site/baseline/site.webmanifest
          grep -q '"name": "Capitan Artiglio"' _site/baseline/site.webmanifest
          grep -q 'baseline-pwa-identity-reset-20261024' _site/baseline/sw-control.json
          grep -q 'const CACHE_VERSION = "baseline-pwa-v1";' _site/baseline/sw.js
          node --check _site/baseline/clean-diagnostics.js
          node --check _site/baseline/sw.js

          if find _site -type f -iname 'CLAW.REZ' | grep -q .; then
            echo 'ERROR: CLAW.REZ must never be deployed' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy root plus clean baseline preview
        id: deployment
        uses: actions/deploy-pages@v4

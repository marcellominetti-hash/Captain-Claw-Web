name: Build temporary SC FlowCast 0.4.13
on:
  push:
    branches: [ flowcast-build-0413 ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore clean-room FlowCast source
        run: |
          mkdir -p flowcast-build
          cat flowcast-payload/part-* | base64 -d > /tmp/flowcast.zip
          unzip -q /tmp/flowcast.zip -d flowcast-build
          printf 'android.useAndroidX=true\n' > flowcast-build/gradle.properties
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36 using preinstalled sdkmanager
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build unsigned release APK
        working-directory: flowcast-build
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SC-FlowCast-v0.4.13-unsigned
          path: flowcast-build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

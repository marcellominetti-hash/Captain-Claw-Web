name: Build Capitan Artiglio APK

on:
  push:
    branches:
      - android-apk-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/arthurboss/claw-web.git
  UPSTREAM_PUBLISHED_COMMIT: ee5041244d7a6903f95523ddfc35eebeb0754f4f

jobs:
  signer:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK signer tool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            -o uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - name: Upload signer tool
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch exact known-working web runtime
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-runtime
          git -C upstream-runtime remote add origin "$UPSTREAM_REPO"
          git -C upstream-runtime fetch --depth=1 origin "$UPSTREAM_PUBLISHED_COMMIT"
          git -C upstream-runtime checkout --detach FETCH_HEAD

          test "$(git hash-object upstream-runtime/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object upstream-runtime/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object upstream-runtime/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"

          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          git -C upstream-runtime archive HEAD | tar -x -C android/app/src/main/assets/www

          printf '%s\n' '// Service worker disabled inside Android APK.' > android/app/src/main/assets/www/sw-register.js

          rm -f android/app/src/main/assets/www/CLAW.REZ
          if find android/app/src/main/assets/www -type f -iname 'CLAW.REZ' | grep -q .; then
            echo 'ERROR: CLAW.REZ must not be inside APK' >&2
            exit 1
          fi

          mkdir -p android/app/src/main/res/drawable
          cp upstream-runtime/android-chrome-192x192.png android/app/src/main/res/drawable/icon.png

      - name: Build debug APK
        shell: bash
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Capitan-Artiglio-v1.apk
          ls -lh dist/Capitan-Artiglio-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capitan-Artiglio-v1-apk
          path: dist/Capitan-Artiglio-v1.apk
          if-no-files-found: error
          retention-days: 7

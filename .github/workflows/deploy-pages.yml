name: Build Capitan Artiglio Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CLAW_WEB_REPO: https://github.com/arthurboss/claw-web.git
  CLAW_WEB_COMMIT: e723d3d48b5ba2cc723751209954cfc46c82d202

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout launcher/patches
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip make python3-pip
          python3 -m pip install --user 'cmake==4.3.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Claw Web source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$CLAW_WEB_REPO"
          git -C upstream fetch --depth=1 origin "$CLAW_WEB_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Patch browser port
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_openclaw_zip.py upstream
          python3 scripts/patch_wasm_level_loading.py upstream
          grep -q 'ResourceZipArchive(rezArchivePath)' upstream/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -q 'CLAW_ASSETS.ZIP' upstream/Build_Release/config.xml
          grep -q "hasFile('CLAW_ASSETS.ZIP')" upstream/Build_Release/game-init.js
          grep -q "file.name.match(/\\^CLAW_ASSETS\\\\.ZIP\\$/i)" upstream/Build_Release/asset-loader.js
          grep -q "storeFile('CLAW_ASSETS.ZIP'" upstream/Build_Release/asset-loader.js
          grep -q '\[PORT LOAD\] Skipping blocking VLoadGame full-level preload' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q '\[PORT LOAD\] Starting .* without blocking bulk preload' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          ! grep -q "file.name.match(/\\^CLAW\\\\.REZ\\$/i)" upstream/Build_Release/asset-loader.js
          ! grep -q "storeFile('CLAW.REZ'" upstream/Build_Release/asset-loader.js
          ! grep -q "That file is not CLAW.REZ" upstream/Build_Release/asset-loader.js

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git upstream/emsdk
          cd upstream/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source ./emsdk/emsdk_env.sh
          cmake --version
          emcc --version
          ./build_wasm.sh

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a upstream/Build_Release/ _site/
          cp _site/claw-web.html _site/index.html
          touch _site/.nojekyll
          rm -f _site/CLAW.REZ _site/CLAW_ASSETS.ZIP

          # Stamp service-worker cache and hard-version every JS URL/import.
          # This prevents an already-active older service worker on Android from
          # serving an old asset-loader.js under a new HTML page.
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path('_site')
          version = os.environ['GITHUB_SHA'][:12]
          tag = 'port-' + version

          # 1) New SW cache namespace per deploy.
          sw = root / 'sw.js'
          s = sw.read_text(encoding='utf-8')
          s, n = re.subn(r'const CACHE_VERSION = "[^"]+";', f'const CACHE_VERSION = "{tag}";', s, count=1)
          if n != 1:
              raise SystemExit('Could not stamp service-worker cache version')
          sw.write_text(s, encoding='utf-8', newline='\n')

          # 2) Version ES-module imports so an old SW cannot satisfy them from
          # an unversioned cache entry.
          import_re = re.compile(r"""(from\s+['"])(\./[^'"]+?\.js)(['"])""")
          side_effect_re = re.compile(r"""(import\s+['"])(\./[^'"]+?\.js)(['"])""")
          for p in root.rglob('*.js'):
              if p.name == 'sw.js':
                  continue
              text = p.read_text(encoding='utf-8')
              text = import_re.sub(lambda m: m.group(1) + m.group(2) + '?v=' + version + m.group(3), text)
              text = side_effect_re.sub(lambda m: m.group(1) + m.group(2) + '?v=' + version + m.group(3), text)
              p.write_text(text, encoding='utf-8', newline='\n')

          # 3) Version every JS reference in both entry HTML files, including
          # the dynamically injected openclaw.js runtime.
          html_js_re = re.compile(r"""(?P<prefix>(?:src|href)=["'])(?P<url>[^"']+?\.js)(?P<suffix>["'])""")
          for name in ('index.html', 'claw-web.html'):
              p = root / name
              text = p.read_text(encoding='utf-8')
              text = html_js_re.sub(
                  lambda m: m.group('prefix') + m.group('url') + '?v=' + version + m.group('suffix'),
                  text,
              )
              text = text.replace('openclaw.js', 'openclaw.js?v=' + version)
              # Avoid double-versioning if a static HTML reference also matched.
              text = text.replace('openclaw.js?v=' + version + '?v=' + version, 'openclaw.js?v=' + version)
              p.write_text(text, encoding='utf-8', newline='\n')

          print('Service-worker cache version:', tag)
          print('Browser JS asset version:', version)
          PY

          cat > _site/PORT_INFO.txt <<'EOF'
          Capitan Artiglio Web

          Browser engine: OpenClaw / claw-web (GNU GPL v3)
          This build changes the primary game-data archive from CLAW.REZ to
          CLAW_ASSETS.ZIP, using OpenClaw's existing ResourceZipArchive backend.

          Original Captain Claw game data is NOT hosted by this site.
          The user imports CLAW_ASSETS.ZIP locally; it is stored in browser IndexedDB.
          EOF

          test -s _site/openclaw.wasm
          test -s _site/openclaw.js
          test -s _site/openclaw.data
          test -s _site/index.html
          grep -q 'CLAW_ASSETS.ZIP' _site/asset-loader.js
          grep -q "hasFile('CLAW_ASSETS.ZIP')" _site/game-init.js
          grep -q "file.name.match(/\\^CLAW_ASSETS\\\\.ZIP\\$/i)" _site/asset-loader.js
          grep -q "storeFile('CLAW_ASSETS.ZIP'" _site/asset-loader.js
          ! grep -q "That file is not CLAW.REZ" _site/asset-loader.js
          grep -q "game-init.js?v=${GITHUB_SHA:0:12}" _site/index.html
          grep -q "asset-loader.js?v=${GITHUB_SHA:0:12}" _site/game-init.js
          grep -q "openclaw.js?v=${GITHUB_SHA:0:12}" _site/index.html
          grep -q "port-${GITHUB_SHA:0:12}" _site/sw.js
          if find _site -type f \( -iname 'CLAW.REZ' -o -iname 'CLAW_ASSETS.ZIP' \) | grep -q .; then
            echo 'ERROR: copyrighted game-data archive must not be deployed.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Official Cast Probe

on:
  push:
    branches:
      - flowcast-probe-build
    paths:
      - 'official_cast_probe/**'
      - '.github/workflows/build-official-cast-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APK
        working-directory: official_cast_probe
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          cp official_cast_probe/app/build/outputs/apk/release/app-release.apk FlowCast-Official-Probe-v0.1.apk
          sha256sum FlowCast-Official-Probe-v0.1.apk | tee FlowCast-Official-Probe-v0.1.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowCast-Official-Probe-v0.1
          path: |
            FlowCast-Official-Probe-v0.1.apk
            FlowCast-Official-Probe-v0.1.sha256
          if-no-files-found: error
          retention-days: 14

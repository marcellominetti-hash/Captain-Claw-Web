plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capitanartiglio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.capitanartiglio.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

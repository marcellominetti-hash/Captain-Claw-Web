name: Debug OpenClaw Custom Runtime v6 Stagebar

on:
  workflow_dispatch:
  push:
    branches: [compat-engine-v3]

permissions:
  contents: read

jobs:
  build-v6-stagebar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact engine
        run: |
          git clone https://github.com/arthurboss/claw-web.git engine
          git -C engine checkout e723d3d48b5ba2cc723751209954cfc46c82d202

      - name: Apply v4 and v5 compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def extract_step(src, step_name, next_step, out):
              y=Path(src).read_text()
              marker=f'      - name: {step_name}\n'
              part=y.split(marker,1)[1]
              part=part.split(f'\n      - name: {next_step}',1)[0]
              body=part.split('        run: |\n',1)[1]
              lines=[]
              for line in body.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              Path(out).write_text('\n'.join(lines)+'\n')

          extract_step('.github/workflows/build-custom-runtime-v4.yml',
                       'Apply compatibility and real custom-level patches',
                       'Install build prerequisites', '/tmp/v4patch.py')
          extract_step('.github/workflows/debug-custom-runtime-v5.yml',
                       'Apply v5 general custom-level compatibility layer',
                       'Install build prerequisites', '/tmp/v5patch.py')
          PY
          python3 /tmp/v4patch.py
          python3 /tmp/v5patch.py

      - name: Add visible stage diagnostics before actor loading
        shell: python
        run: |
          from pathlib import Path
          p=Path('engine/OpenClaw/Engine/GameApp/BaseGameLogic.cpp')
          s=p.read_text(encoding='utf-8')

          old='''    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n\n    // ============== LEVEL LOADING ==============\n\n    WapWwd* pWwd = WwdResourceLoader::LoadAndReturnWwd(xmlLevelResource);\n    assert(pWwd != NULL);\n\n    TiXmlElement* pXmlLevelRoot = WwdToXml(pWwd, m_pCurrentLevel->GetLevelNumber());'''
          new='''    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n\n    // STAGE 1 (20%): loading screen is alive, next operation is WWD lookup/parse.\n    loadingProgress = 20.0f;\n    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n    LOG_WARNING("[STAGEBAR] 20 before WWD load");\n\n    // ============== LEVEL LOADING ==============\n\n    WapWwd* pWwd = WwdResourceLoader::LoadAndReturnWwd(xmlLevelResource);\n    if (pWwd == NULL)\n    {\n        LOG_ERROR("[STAGEBAR] WWD load returned NULL: " + std::string(xmlLevelResource));\n        return false;\n    }\n\n    // STAGE 2 (40%): WWD lookup + libwap parse succeeded.\n    loadingProgress = 40.0f;\n    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n    LOG_WARNING("[STAGEBAR] 40 WWD parsed");\n\n    TiXmlElement* pXmlLevelRoot = WwdToXml(pWwd, m_pCurrentLevel->GetLevelNumber());'''
          if old not in s:
              raise SystemExit('stagebar WWD anchor missing')
          s=s.replace(old,new,1)

          old='''    if (pXmlLevelRoot == NULL)\n    {\n        LOG_ERROR("Could not load level resource file: " + std::string(xmlLevelResource));\n        return false;\n    }\n\n    // Get level palette'''
          new='''    if (pXmlLevelRoot == NULL)\n    {\n        LOG_ERROR("Could not load level resource file: " + std::string(xmlLevelResource));\n        return false;\n    }\n\n    // STAGE 3 (60%): complete WWD -> XML conversion succeeded.\n    loadingProgress = 60.0f;\n    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n    LOG_WARNING("[STAGEBAR] 60 WwdToXml complete");\n\n    // Get level palette'''
          if old not in s:
              raise SystemExit('stagebar XML anchor missing')
          s=s.replace(old,new,1)

          old='''    loadingProgress = 10.0f;\n    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);'''
          new='''    // STAGE 4 (80%): level properties and tile metadata were consumed safely.\n    loadingProgress = 80.0f;\n    RenderLoadingScreen(pBackgroundImage, backgroundRect, scale, loadingProgress);\n    LOG_WARNING("[STAGEBAR] 80 tile metadata complete; starting actors");'''
          if old not in s:
              raise SystemExit('stagebar tile anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('v6 stagebar diagnostics applied')

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build python3 python3-pip git zip
          python3 -m pip install --user --break-system-packages 'cmake>=4.3.2'
          hash -r
          cmake --version

      - name: Install Emscripten
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git engine/emsdk
          cd engine/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          cd engine
          source ./emsdk/emsdk_env.sh
          chmod +x build_wasm.sh patch_sdl2_shaders.sh || true
          ./build_wasm.sh

      - name: Verify diagnostic runtime
        run: |
          set -euo pipefail
          test -s engine/Build_Release/openclaw.wasm
          test -s engine/Build_Release/openclaw.js
          test -s engine/Build_Release/openclaw.data
          grep -q '\[STAGEBAR\] 20 before WWD load' engine/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q '\[STAGEBAR\] 40 WWD parsed' engine/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q '\[STAGEBAR\] 60 WwdToXml complete' engine/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q '\[STAGEBAR\] 80 tile metadata complete' engine/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          strings engine/Build_Release/openclaw.wasm | grep -q '\[STAGEBAR\] 40 WWD parsed'
          sha256sum engine/Build_Release/openclaw.wasm engine/Build_Release/openclaw.js engine/Build_Release/openclaw.data engine/Build_Release/ASSETS.ZIP > engine/Build_Release/v6-stagebar-sha256.txt
          cat engine/Build_Release/v6-stagebar-sha256.txt

      - name: Upload diagnostic runtime
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-custom-runtime-v6-stagebar
          path: |
            engine/Build_Release/openclaw.wasm
            engine/Build_Release/openclaw.js
            engine/Build_Release/openclaw.data
            engine/Build_Release/ASSETS.ZIP
            engine/Build_Release/v6-stagebar-sha256.txt
          if-no-files-found: error
          retention-days: 7

name: Recovery mobile loader build

on:
  push:
    branches:
      - recovery/mobile-loader-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CLAW_WEB_REPO: https://github.com/arthurboss/claw-web.git
  CLAW_WEB_COMMIT: e723d3d48b5ba2cc723751209954cfc46c82d202
  CLAW_WEB_PAGES_COMMIT: ee5041244d7a6903f95523ddfc35eebeb0754f4f

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip make python3-pip rsync
          python3 -m pip install --user 'cmake==4.3.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$CLAW_WEB_REPO"
          git -C upstream fetch --depth=1 origin "$CLAW_WEB_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Apply minimal recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_recovery_mobile_loader.py upstream
          python3 scripts/fix_recovery_zip_filename_validation.py upstream

          grep -q 'ResourceZipArchive(rezArchivePath)' upstream/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -q 'm_bResetLevelPending' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q 'emscripten_sleep(0)' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q '_matchCache.find(patternCopy)' upstream/OpenClaw/Engine/Resource/ResourceCache.cpp
          grep -q 'addRunDependency(dependency)' upstream/Build_Release/asset-loader.js
          grep -q 'CLAW_ASSETS.ZIP' upstream/Build_Release/config.xml
          grep -Fq '/^CLAW_ASSETS\.ZIP$/i' upstream/Build_Release/asset-loader.js
          if grep -Fq '/^CLAW\.REZ$/i' upstream/Build_Release/asset-loader.js; then
            echo 'ERROR: legacy CLAW.REZ filename validator remains' >&2
            exit 1
          fi
          node --input-type=module --check < upstream/Build_Release/asset-loader.js
          node --input-type=module --check < upstream/Build_Release/game-init.js

          if grep -q "FS.writeFile('/CLAW_ASSETS.ZIP'" upstream/Build_Release/asset-loader.js; then
            echo 'ERROR: whole-file asset copy is still present' >&2
            exit 1
          fi

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git upstream/emsdk
          cd upstream/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly recovery engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source ./emsdk/emsdk_env.sh
          ./build_wasm.sh

      - name: Assemble recovery artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovery-site
          mkdir -p recovery-site
          rsync -a upstream/Build_Release/ recovery-site/
          cp recovery-site/claw-web.html recovery-site/index.html
          touch recovery-site/.nojekyll

          # User-supplied Captain Claw game data is never committed/published.
          rm -f recovery-site/CLAW.REZ recovery-site/CLAW_ASSETS.ZIP

          cat > recovery-site/RECOVERY_BUILD.txt <<EOF
          branch=recovery/mobile-loader-v1
          repository_commit=${GITHUB_SHA}
          upstream_commit=${CLAW_WEB_COMMIT}
          archive=CLAW_ASSETS.ZIP
          actor_batch=20
          mount_chunk_bytes=2097152
          EOF

          test -s recovery-site/openclaw.js
          test -s recovery-site/openclaw.wasm
          test -s recovery-site/openclaw.data
          grep -q 'CLAW_ASSETS.ZIP' recovery-site/asset-loader.js
          grep -Fq '/^CLAW_ASSETS\.ZIP$/i' recovery-site/asset-loader.js
          node --input-type=module --check < recovery-site/asset-loader.js
          node --input-type=module --check < recovery-site/game-init.js

      - name: Upload recovery site artifact
        uses: actions/upload-artifact@v4
        with:
          name: captain-claw-recovery-site
          path: recovery-site/
          if-no-files-found: error
          retention-days: 7

      - name: Fetch exact production runtime
        shell: bash
        run: |
          set -euo pipefail
          git init production-site
          git -C production-site remote add origin "$CLAW_WEB_REPO"
          git -C production-site fetch --depth=1 origin "$CLAW_WEB_PAGES_COMMIT"
          git -C production-site checkout --detach FETCH_HEAD

          test "$(git hash-object production-site/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object production-site/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object production-site/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"

      - name: Assemble production plus isolated preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Root is exported verbatim from the exact production snapshot used by main.
          git -C production-site archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          # Recovery is isolated below /recovery/ with relative URLs and its own SW scope.
          mkdir -p _site/recovery
          rsync -a recovery-site/ _site/recovery/

          rm -f _site/CLAW.REZ _site/CLAW_ASSETS.ZIP
          rm -f _site/recovery/CLAW.REZ _site/recovery/CLAW_ASSETS.ZIP

          # Prove the public root has not changed from the production runtime.
          test "$(git hash-object _site/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object _site/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object _site/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'CLAW.REZ' _site/asset-loader.js

          # Prove preview is the recovery build and remains self-contained.
          grep -q 'CLAW_ASSETS.ZIP' _site/recovery/asset-loader.js
          grep -Fq '/^CLAW_ASSETS\.ZIP$/i' _site/recovery/asset-loader.js
          grep -q 'actor_batch=20' _site/recovery/RECOVERY_BUILD.txt
          test -s _site/recovery/openclaw.wasm

          if find _site -type f \( -iname 'CLAW.REZ' -o -iname 'CLAW_ASSETS.ZIP' \) | grep -q .; then
            echo 'ERROR: user game data must not be deployed.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-preview:
    needs: build-recovery
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production root plus recovery preview
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Capitan Artiglio Collection v2 Base

on:
  push:
    branches:
      - collection-v2-ui
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SOURCE_COMMIT: e723d3d48b5ba2cc723751209954cfc46c82d202

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Collection v2
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sudo apt-get update
          sudo apt-get install -y zip unzip make python3-pip rsync
          python3 -m pip install --user 'cmake==4.3.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned OpenClaw source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/arthurboss/claw-web.git
          git -C upstream fetch --depth=1 origin "$UPSTREAM_SOURCE_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Apply custom-level runtime patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_custom_levels.py upstream
          python3 scripts/patch_custom_level_resource_routing.py upstream
          grep -q 'CUSTOM_LEVEL_RESOURCE' upstream/OpenClaw/Engine/SharedDefines.h
          grep -q 'CUSTOM_LEVEL.ZIP detected' upstream/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -q 'CUSTOM_LEVEL.NUM' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q 'GetResourceMgr()->VGetHandle' upstream/OpenClaw/Engine/Resource/Loaders/WwdLoader.cpp

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git upstream/emsdk
          cd upstream/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build custom-level WebAssembly runtime
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source ./emsdk/emsdk_env.sh
          ./build_wasm.sh

      - name: Assemble Android Collection web assets
        shell: bash
        run: |
          set -euo pipefail
          WEBROOT=android/app/src/main/assets/www
          rm -rf "$WEBROOT"
          mkdir -p "$WEBROOT"
          rsync -a upstream/Build_Release/ "$WEBROOT/"

          # Collection v2 shell: a lightweight library page and preRun loader.
          cp android/collection-web/levels.html "$WEBROOT/levels.html"
          cp android/collection-web/custom-levels.js "$WEBROOT/custom-levels.js"
          mkdir -p "$WEBROOT/custom-levels"
          cp android/collection-web/custom-levels/manifest.json "$WEBROOT/custom-levels/manifest.json"

          python3 scripts/inject_collection_v2_runtime.py "$WEBROOT/claw-web.html"
          cp "$WEBROOT/claw-web.html" "$WEBROOT/index.html"

          # Service workers are unnecessary inside WebViewAssetLoader.
          printf '%s\n' '// Service worker disabled inside Android APK.' > "$WEBROOT/sw-register.js"

          # Proprietary/user-supplied content is injected only into the private final build.
          rm -f "$WEBROOT/CLAW.REZ"
          rm -f "$WEBROOT/CUSTOM_LEVEL.ZIP"
          rm -f "$WEBROOT/CUSTOM_LEVEL.NUM"
          if find android/app/src/main/assets -type f -iname 'CLAW.REZ' | grep -q .; then
            echo 'ERROR: CLAW.REZ must not be published by CI' >&2
            exit 1
          fi

          mkdir -p android/app/src/main/res/drawable
          cp upstream/Build_Release/android-chrome-192x192.png android/app/src/main/res/drawable/icon.png

          test -s "$WEBROOT/openclaw.js"
          test -s "$WEBROOT/openclaw.wasm"
          test -s "$WEBROOT/openclaw.data"
          test -s "$WEBROOT/levels.html"
          grep -q 'custom-levels.js' "$WEBROOT/index.html"
          grep -q 'ClawCustomLevels.mountSelected' "$WEBROOT/index.html"

      - name: Build Collection v2 base APK
        shell: bash
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/www/levels.html'
          unzip -l "$APK" | grep -q 'assets/www/custom-levels.js'
          if unzip -l "$APK" | grep -qi 'CLAW.REZ'; then
            echo 'ERROR: CI base APK contains CLAW.REZ' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Capitan-Artiglio-Collection-v2-base.apk
          ls -lh dist/Capitan-Artiglio-Collection-v2-base.apk

      - name: Upload Collection v2 base
        uses: actions/upload-artifact@v4
        with:
          name: Capitan-Artiglio-Collection-v2-base
          path: dist/Capitan-Artiglio-Collection-v2-base.apk
          if-no-files-found: error
          retention-days: 7

name: Build Capitan Artiglio Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CLAW_WEB_REPO: https://github.com/arthurboss/claw-web.git
  CLAW_WEB_COMMIT: e723d3d48b5ba2cc723751209954cfc46c82d202

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout launcher/patches
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip make python3-pip
          python3 -m pip install --user 'cmake==4.3.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Claw Web source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$CLAW_WEB_REPO"
          git -C upstream fetch --depth=1 origin "$CLAW_WEB_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Patch browser port
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_openclaw_zip.py upstream
          python3 scripts/patch_zip_path_normalization.py upstream
          python3 scripts/patch_render_path_normalization.py upstream
          python3 scripts/patch_wasm_level_loading.py upstream
          python3 scripts/patch_actor_diagnostics.py upstream
          grep -q 'ResourceZipArchive(rezArchivePath)' upstream/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -q 'NormalizeZipPath' upstream/OpenClaw/Engine/Resource/ZipFile.cpp
          grep -q 'normalizedImagePath' upstream/OpenClaw/Engine/Actor/Components/RenderComponent.cpp
          grep -q 'CLAW_ASSETS.ZIP' upstream/Build_Release/config.xml
          grep -q '__setClawLoadStatus' upstream/OpenClaw/Engine/GameApp/BaseGameLogic.cpp
          grep -q 'PortActorStatus' upstream/OpenClaw/Engine/Actor/ActorFactory.cpp
          grep -q 'PortRenderStatus' upstream/OpenClaw/Engine/Actor/Components/RenderComponent.cpp
          grep -q 'id="portLoadStatus"' upstream/Build_Release/claw-web.html

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git upstream/emsdk
          cd upstream/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build WebAssembly engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source ./emsdk/emsdk_env.sh
          ./build_wasm.sh

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a upstream/Build_Release/ _site/
          cp _site/claw-web.html _site/index.html
          touch _site/.nojekyll
          rm -f _site/CLAW.REZ _site/CLAW_ASSETS.ZIP

          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil

          root = Path('_site')
          version = os.environ['GITHUB_SHA'][:12]
          tag = 'port-' + version
          wasm_name = f'openclaw-{version}.wasm'
          data_name = f'openclaw-{version}.data'

          # Physical versioned runtime binaries: no query strings on WASM/data.
          shutil.copy2(root / 'openclaw.wasm', root / wasm_name)
          shutil.copy2(root / 'openclaw.data', root / data_name)

          # New service-worker namespace for every deploy.
          sw = root / 'sw.js'
          text = sw.read_text(encoding='utf-8')
          text, n = re.subn(
              r'const CACHE_VERSION = "[^"]+";',
              f'const CACHE_VERSION = "{tag}";',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not stamp service-worker cache version')
          sw.write_text(text, encoding='utf-8')

          # Version ES-module imports.
          import_re = re.compile(r"""(from\s+['"])(\./[^'"]+?\.js)(['"])""")
          side_re = re.compile(r"""(import\s+['"])(\./[^'"]+?\.js)(['"])""")
          for p in root.rglob('*.js'):
              if p.name == 'sw.js':
                  continue
              js = p.read_text(encoding='utf-8')
              js = import_re.sub(lambda m: m.group(1) + m.group(2) + '?v=' + version + m.group(3), js)
              js = side_re.sub(lambda m: m.group(1) + m.group(2) + '?v=' + version + m.group(3), js)
              p.write_text(js, encoding='utf-8')

          # Replace the query-string binary cache busting with real filenames.
          locator_re = re.compile(
              r"""        locateFile: function \(path, prefix\) \{.*?        \},""",
              re.S,
          )
          new_locator = "\n".join([
              "        locateFile: function (path, prefix) {",
              "          if (path.indexOf('openclaw.wasm') !== -1) {",
              f"            return (prefix || '') + '{wasm_name}';",
              "          }",
              "          if (path.indexOf('openclaw.data') !== -1) {",
              f"            return (prefix || '') + '{data_name}';",
              "          }",
              "          return (prefix || '') + path;",
              "        },",
          ])

          html_js_re = re.compile(r"""(?P<prefix>(?:src|href)=["'])(?P<url>[^"']+?\.js)(?P<suffix>["'])""")
          for name in ('index.html', 'claw-web.html'):
              p = root / name
              html = p.read_text(encoding='utf-8')
              html, n = locator_re.subn(new_locator, html, count=1)
              if n != 1:
                  raise SystemExit(f'Binary locateFile block not found in {name}')
              html = html_js_re.sub(
                  lambda m: m.group('prefix') + m.group('url') + '?v=' + version + m.group('suffix'),
                  html,
              )
              html = html.replace('openclaw.js', 'openclaw.js?v=' + version)
              html = html.replace('openclaw.js?v=' + version + '?v=' + version, 'openclaw.js?v=' + version)
              p.write_text(html, encoding='utf-8')

          print('Runtime binaries:', wasm_name, data_name)
          print('Service-worker cache:', tag)
          PY

          test -s "_site/openclaw-${GITHUB_SHA:0:12}.wasm"
          test -s "_site/openclaw-${GITHUB_SHA:0:12}.data"
          grep -q "openclaw-${GITHUB_SHA:0:12}.wasm" _site/index.html
          grep -q "openclaw-${GITHUB_SHA:0:12}.data" _site/index.html
          grep -q "game-init.js?v=${GITHUB_SHA:0:12}" _site/index.html
          grep -q "port-${GITHUB_SHA:0:12}" _site/sw.js
          grep -q 'CLAW_ASSETS.ZIP' _site/asset-loader.js
          grep -q 'id="portLoadStatus"' _site/index.html

          if find _site -type f \( -iname 'CLAW.REZ' -o -iname 'CLAW_ASSETS.ZIP' \) | grep -q .; then
            echo 'ERROR: game-data archive must not be deployed.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Capitan Artiglio Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CLAW_WEB_REPO: https://github.com/arthurboss/claw-web.git
  CLAW_WEB_COMMIT: e723d3d48b5ba2cc723751209954cfc46c82d202

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip make python3-pip rsync
          python3 -m pip install --user 'cmake==4.3.2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pristine stable Claw Web source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$CLAW_WEB_REPO"
          git -C upstream fetch --depth=1 origin "$CLAW_WEB_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

          # Golden-path validation: do not replace the tested REZ backend.
          grep -q 'ResourceRezArchive(rezArchivePath)' upstream/OpenClaw/Engine/GameApp/BaseGameApp.cpp
          grep -q 'CLAW.REZ' upstream/Build_Release/config.xml
          grep -q 'CLAW.REZ' upstream/Build_Release/asset-loader.js
          grep -q 'touch-controls.js' upstream/Build_Release/claw-web.html

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git upstream/emsdk
          cd upstream/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build pristine WebAssembly engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source ./emsdk/emsdk_env.sh
          ./build_wasm.sh

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a upstream/Build_Release/ _site/
          cp _site/claw-web.html _site/index.html
          touch _site/.nojekyll

          # Never publish copyrighted game data. The upstream UI asks the user
          # to import their own CLAW.REZ locally and stores it in IndexedDB.
          rm -f _site/CLAW.REZ _site/CLAW_ASSETS.ZIP

          # Force a fresh shell cache after this clean rebuild while otherwise
          # leaving upstream HTML/JS/WASM untouched and version-compatible.
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          sw = Path('_site/sw.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              version = 'clean-' + os.environ['GITHUB_SHA'][:12]
              text2, n = re.subn(
                  r'const CACHE_VERSION = ["\'][^"\']+["\'];',
                  f'const CACHE_VERSION = "{version}";',
                  text,
                  count=1,
              )
              if n == 1:
                  sw.write_text(text2, encoding='utf-8')
                  print('Service-worker cache:', version)
              else:
                  print('CACHE_VERSION not found; leaving upstream service worker unchanged')
          PY

          test -s _site/openclaw.js
          test -s _site/openclaw.wasm
          test -s _site/openclaw.data
          grep -q 'CLAW.REZ' _site/asset-loader.js
          grep -q 'touch-controls.js' _site/index.html

          if find _site -type f \( -iname 'CLAW.REZ' -o -iname 'CLAW_ASSETS.ZIP' \) | grep -q .; then
            echo 'ERROR: game-data archive must not be deployed.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

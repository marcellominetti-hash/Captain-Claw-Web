name: Clean baseline diagnostics preview

on:
  push:
    branches:
      - clean-baseline-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/arthurboss/claw-web.git
  UPSTREAM_PUBLISHED_COMMIT: ee5041244d7a6903f95523ddfc35eebeb0754f4f

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Fetch exact upstream published runtime
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-runtime
          git -C upstream-runtime remote add origin "$UPSTREAM_REPO"
          git -C upstream-runtime fetch --depth=1 origin "$UPSTREAM_PUBLISHED_COMMIT"
          git -C upstream-runtime checkout --detach FETCH_HEAD

          test "$(git hash-object upstream-runtime/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object upstream-runtime/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object upstream-runtime/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'CLAW.REZ' upstream-runtime/asset-loader.js
          grep -q 'ASSETS.ZIP' upstream-runtime/config.xml

      - name: Assemble root baseline and fresh Capitan Artiglio PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site baseline-site capitan-site
          mkdir -p _site baseline-site capitan-site

          # Preserve root exactly as upstream published runtime.
          git -C upstream-runtime archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          # Golden working baseline: same exact runtime + diagnostics only.
          git -C upstream-runtime archive HEAD | tar -x -C baseline-site
          python3 scripts/inject_clean_diagnostics.py baseline-site
          mkdir -p _site/baseline
          rsync -a baseline-site/ _site/baseline/

          # Fresh PWA path: clone the known-working baseline, then change only
          # PWA metadata/shell identity. Engine binaries remain byte-identical.
          rsync -a baseline-site/ capitan-site/

          cat > capitan-site/capitan-artiglio.webmanifest <<'EOF'
          {
            "id": "/Captain-Claw-Web/capitan-artiglio/app-v1",
            "name": "Capitan Artiglio",
            "short_name": "Capitan Artiglio",
            "description": "Capitan Artiglio - Captain Claw (1997) sul browser",
            "start_url": "/Captain-Claw-Web/capitan-artiglio/?source=pwa",
            "scope": "/Captain-Claw-Web/capitan-artiglio/",
            "display": "fullscreen",
            "orientation": "landscape",
            "background_color": "#000000",
            "theme_color": "#000000",
            "launch_handler": {"client_mode": ["navigate-new", "auto"]},
            "icons": [
              {"src": "android-chrome-192x192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},
              {"src": "android-chrome-512x512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
              {"src": "android-chrome-512x512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"}
            ],
            "categories": ["games"],
            "lang": "it"
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('index.html', 'claw-web.html'):
              p = Path('capitan-site') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<link rel="manifest" href="[^"]+"\s*/?>',
                         '<link rel="manifest" href="capitan-artiglio.webmanifest?v=1" />', s, count=1)
              s = re.sub(r'<title>.*?</title>', '<title>Capitan Artiglio</title>', s, count=1)
              s = s.replace('content="Claw Web"', 'content="Capitan Artiglio"')
              s = s.replace('Captain Claw (1997) reimplemented for the browser - unofficial fan project',
                            'Capitan Artiglio - Captain Claw (1997) sul browser')
              p.write_text(s, encoding='utf-8')

          sw = Path('capitan-site/sw.js')
          text = sw.read_text(encoding='utf-8')
          text, n = re.subn(r'const CACHE_VERSION = "[^"]+";',
                            'const CACHE_VERSION = "capitan-artiglio-pwa-v1";',
                            text, count=1)
          if n != 1:
              raise SystemExit('Could not set Capitan Artiglio SW cache version')
          sw.write_text(text, encoding='utf-8')

          # Fresh scope: no inherited kill switch required.
          Path('capitan-site/sw-control.json').write_text('{"unregister":""}\n', encoding='utf-8')
          PY

          mkdir -p _site/capitan-artiglio
          rsync -a capitan-site/ _site/capitan-artiglio/

          # Never publish the user's game archive.
          rm -f _site/CLAW.REZ _site/baseline/CLAW.REZ _site/capitan-artiglio/CLAW.REZ
          if find _site -type f -iname 'CLAW.REZ' | grep -q .; then
            echo 'ERROR: CLAW.REZ must never be deployed' >&2
            exit 1
          fi

          # Engine must remain identical in root, baseline and PWA.
          for dir in _site _site/baseline _site/capitan-artiglio; do
            test "$(git hash-object "$dir/openclaw.js")" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
            test "$(git hash-object "$dir/openclaw.data")" = "45ebec8d48167c768f24be3a024069904c0aa08c"
            test "$(git hash-object "$dir/openclaw.wasm")" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          done

          grep -q 'clean-diagnostics.js' _site/baseline/index.html
          grep -q 'clean-diagnostics.js' _site/capitan-artiglio/index.html
          grep -q 'capitan-artiglio.webmanifest?v=1' _site/capitan-artiglio/index.html
          grep -q '"name": "Capitan Artiglio"' _site/capitan-artiglio/capitan-artiglio.webmanifest
          grep -q '"id": "/Captain-Claw-Web/capitan-artiglio/app-v1"' _site/capitan-artiglio/capitan-artiglio.webmanifest
          grep -q 'const CACHE_VERSION = "capitan-artiglio-pwa-v1";' _site/capitan-artiglio/sw.js
          node --check _site/capitan-artiglio/clean-diagnostics.js
          node --check _site/capitan-artiglio/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy root baseline and Capitan Artiglio PWA
        id: deployment
        uses: actions/deploy-pages@v4

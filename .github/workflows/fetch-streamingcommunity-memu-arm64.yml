name: Fetch StreamingCommunity MEmu arm64
on:
  push:
    branches: [flowcast-probe-build]
    paths:
      - '.github/workflows/fetch-streamingcommunity-memu-arm64.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download resolved arm64 XAPK
        shell: bash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          PAGE='https://m.memuplay.com/it/download-streaming-community.html'
          URL='https://www.memuplay.com/apkdownload.php?file_name=com.devshifters.streamingcommunity-20250312-3f0ad2af.xapk&from=app_details_it_com.devshifters.streamingcommunity'
          curl -fL -A "$UA" -c cookies.txt -b cookies.txt "$PAGE" -o page.html
          echo "$URL" | tee download-url.txt
          curl -fL --retry 3 --retry-delay 2 -A "$UA" -e "$PAGE" -c cookies.txt -b cookies.txt "$URL" -o streamingcommunity-memu.bin
          file streamingcommunity-memu.bin
          ls -lh streamingcommunity-memu.bin
          sha256sum streamingcommunity-memu.bin | tee sha256.txt
          python - <<'PY'
          import zipfile, json
          p='streamingcommunity-memu.bin'
          if not zipfile.is_zipfile(p):
              raise SystemExit('Downloaded payload is not APK/XAPK zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              open('listing.txt','w').write('\n'.join(names))
              report={
                'files': len(names),
                'arm64': [n for n in names if 'arm64' in n.lower() or 'arm64-v8a' in n.lower()][:200],
                'manifest_candidates':[n for n in names if n.endswith('manifest.json') or n.endswith('.apk')][:100]
              }
              open('inspection.json','w').write(json.dumps(report,indent=2))
              print(json.dumps(report,indent=2))
          PY

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamingcommunity-memu-arm64
          path: |
            streamingcommunity-memu.bin
            page.html
            download-url.txt
            listing.txt
            inspection.json
            sha256.txt
          if-no-files-found: warn
          retention-days: 7

name: Fetch StreamingCommunity MEmu arm64
on:
  push:
    branches: [flowcast-probe-build]
    paths:
      - '.github/workflows/fetch-streamingcommunity-memu-arm64.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch page and download arm64 package
        shell: bash
        run: |
          set -euxo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          PAGE='https://m.memuplay.com/it/download-streaming-community.html'
          curl -fL -A "$UA" -c cookies.txt -b cookies.txt "$PAGE" -o page.html
          grep -oE 'https?://[^"'"' ]+|apkdownload\.php\?[^"'"' ]+' page.html | grep -i 'apkdownload\|xapk\|apk' | head -50 | tee links.txt || true
          URL=$(python - <<'PY'
          import re, html
          s=open('page.html',errors='ignore').read()
          m=re.search(r'href=["\x27]([^"\x27]*apkdownload\.php\?[^"\x27]+)["\x27]',s,re.I)
          if not m:
              raise SystemExit('No apkdownload link in page')
          u=html.unescape(m.group(1))
          if u.startswith('/'):
              u='https://www.memuplay.com'+u
          elif not u.startswith('http'):
              u='https://www.memuplay.com/'+u.lstrip('/')
          print(u)
          PY
          )
          echo "$URL" | tee download-url.txt
          curl -fL --retry 3 --retry-delay 2 -A "$UA" -e "$PAGE" -c cookies.txt -b cookies.txt "$URL" -o streamingcommunity-memu.bin
          file streamingcommunity-memu.bin
          ls -lh streamingcommunity-memu.bin
          sha256sum streamingcommunity-memu.bin | tee sha256.txt
          python - <<'PY'
          import zipfile, os
          p='streamingcommunity-memu.bin'
          if not zipfile.is_zipfile(p):
              raise SystemExit('Downloaded payload is not APK/XAPK zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              open('listing.txt','w').write('\n'.join(names))
              print('\n'.join(names[:500]))
              print('ARM64', [n for n in names if 'arm64' in n.lower()][:100])
          PY

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamingcommunity-memu-arm64
          path: |
            streamingcommunity-memu.bin
            page.html
            links.txt
            download-url.txt
            listing.txt
            sha256.txt
          if-no-files-found: warn
          retention-days: 7

name: Deploy Capitan Artiglio Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CLAW_WEB_REPO: https://github.com/arthurboss/claw-web.git
  # Exact upstream Pages snapshot already built and published by Claw Web.
  # Pinning this commit also pins the matching JS/WASM/DATA triplet.
  CLAW_WEB_PAGES_COMMIT: ee5041244d7a6903f95523ddfc35eebeb0754f4f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Fetch exact upstream published runtime
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-site
          git -C upstream-site remote add origin "$CLAW_WEB_REPO"
          git -C upstream-site fetch --depth=1 origin "$CLAW_WEB_PAGES_COMMIT"
          git -C upstream-site checkout --detach FETCH_HEAD

          # Verify we fetched the exact tested binary set from upstream gh-pages.
          test "$(git hash-object upstream-site/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object upstream-site/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object upstream-site/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'CLAW.REZ' upstream-site/asset-loader.js
          grep -q 'touch-controls.js' upstream-site/index.html

      - name: Assemble exact upstream GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Export the already-built upstream gh-pages snapshot verbatim.
          # No Emscripten, CMake, engine patch, JS rewrite or binary rename.
          git -C upstream-site archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          # The original game archive must always be supplied locally by the player.
          rm -f _site/CLAW.REZ _site/CLAW_ASSETS.ZIP

          # Final integrity checks: JS/WASM/DATA must remain the exact upstream trio.
          test "$(git hash-object _site/openclaw.js)" = "f76a4d004a69442d88c89a531155f15aa1dfd360"
          test "$(git hash-object _site/openclaw.data)" = "45ebec8d48167c768f24be3a024069904c0aa08c"
          test "$(git hash-object _site/openclaw.wasm)" = "5222291f652b3f85e0c5d6b67f46263e2d004330"
          grep -q 'CLAW.REZ' _site/asset-loader.js
          # Root production SW is v13; ee504 only bumps staging/sw.js to v14.
          grep -q 'const CACHE_VERSION = "v13"' _site/sw.js

          if find _site -type f \( -iname 'CLAW.REZ' -o -iname 'CLAW_ASSETS.ZIP' \) | grep -q .; then
            echo 'ERROR: original game archive must not be deployed.' >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
